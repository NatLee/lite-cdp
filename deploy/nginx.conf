# Included from nginx.conf's http context. Never log OAuth query parameters.
log_format safe_path '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent upstream=$upstream_status '
                     'connect=$upstream_connect_time response=$upstream_response_time';

# Docker DNS refreshes the backend address after container replacement.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream backend {
    zone backend 64k;
    server lite-cdp:8585 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    access_log /dev/stdout safe_path;
    # Request-bearing nginx errors can contain OAuth query secrets, even at crit.
    # Main-process startup errors still go to the image's stderr logger.
    # Safe access logs retain status and upstream timings for runtime diagnostics.
    error_log /dev/null crit;

    include /etc/nginx/snippets/proxy.conf;

    location = /healthz {
        include /etc/nginx/snippets/static-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No URI suffix on proxy_pass: keep the original path and query unchanged.
    location ~ ^/(api|oauth|\.well-known|mcp)(/|$) {
        proxy_pass http://backend;
    }

    # Tracking endpoints must never fall through to the SPA.
    location = /collect {
        proxy_pass http://backend;
    }
    location ^~ /collect/ {
        proxy_pass http://backend;
    }
    location = /t.js {
        proxy_pass http://backend;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/static-headers.conf;
        try_files $uri =404;
    }

    location ^~ /images/ {
        include /etc/nginx/snippets/static-headers.conf;
        try_files $uri =404;
    }

    # Missing file requests must never return the SPA's HTML with a successful status.
    location ~* \.(avif|bmp|gif|ico|jpe?g|png|svg|webp|css|js|mjs|map|json|webmanifest|txt|woff2?|ttf|otf|eot|wasm)$ {
        include /etc/nginx/snippets/static-headers.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/static-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
