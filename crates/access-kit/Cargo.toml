[package]
name = "access-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
default = []
test-support = []

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
jsonschema = { version = "=0.63.2", default-features = false }
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "=4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.12.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
url = "2"

[dev-dependencies]
rand_chacha="0.3"
rsa = {version="0.9",features=["pem","sha2"]}
signature="2"
http-body-util = "0.1"
tempfile = "3"
rmcp = { version = "=3.12.0", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest"] }
sdk-reqwest = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "rustls"] }

[[example]]
name="mock_provider"
required-features=["test-support"]
