<!doctype html>
<!-- README 最上面那張圖。用瀏覽器開 hero.html（淺色）或 hero.html?dark（深色），截 1280×360。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --bg: #ffffff; --fg: #18181b; --muted: #52525b; --card: #f4f4f5; --paper: #ffffff; --line: #e4e4e7; --brand: #4f46e5; --new: #d97706; --done: #059669; }
      .dark { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b; --paper: #27272a; --line: #3f3f46; --brand: #a5b4fc; --new: #fbbf24; --done: #34d399; }
      * { box-sizing: border-box; margin: 0; }
      body { width: 1280px; height: 360px; background: var(--bg); color: var(--fg); font-family: "Inter", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
        display: flex; align-items: center; gap: 56px; padding: 0 72px;
        background-image: radial-gradient(520px 300px at 88% 0%, color-mix(in oklab, var(--brand) 22%, transparent), transparent 70%); }
      .logo { width: 72px; height: 72px; }
      h1 { font-size: 52px; letter-spacing: -0.03em; margin-top: 18px; white-space: nowrap; }
      p { font-size: 22px; color: var(--muted); margin-top: 10px; white-space: nowrap; }
      .panel { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
      .code { font: 15px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); padding: 2px 6px 6px; white-space: nowrap; }
      .code b { color: var(--brand); font-weight: 600; }
      .row { display: flex; align-items: center; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 11px 16px; font-size: 17px; }
      .who { font-weight: 600; width: 78px; white-space: nowrap; }
      .msg { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
      .new { color: var(--new); background: color-mix(in oklab, var(--new) 16%, transparent); }
      .wip { color: var(--brand); background: color-mix(in oklab, var(--brand) 16%, transparent); }
      .done { color: var(--done); background: color-mix(in oklab, var(--done) 16%, transparent); }
    </style>
  </head>
  <body>
    <div>
      <img class="logo" src="../../../src/web/public/favicon.svg" alt="" />
      <h1>Lite CDP</h1>
      <p>誰來過、看了什麼、該找誰</p>
    </div>
    <div class="panel">
      <div class="code">&lt;script async src="<b>https://cdp.example.com/t.js</b>" data-key="…"&gt;</div>
      <div class="row"><span class="who">周怡君</span><span class="msg">看了 3 次定價頁・從 Google 來</span><span class="tag new">看過定價</span></div>
      <div class="row"><span class="who">匿名 #48</span><span class="msg">加入購物車，還沒結帳</span><span class="tag wip">購物車</span></div>
      <div class="row"><span class="who">王小明</span><span class="msg">登入了：之前匿名的紀錄併在一起</span><span class="tag done">會員</span></div>
    </div>
    <script>if (location.search.includes("dark")) document.documentElement.classList.add("dark");</script>
  </body>
</html>
