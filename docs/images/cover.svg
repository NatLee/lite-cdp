<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc"><title id="title">Lite CDP — Know who comes back</title><desc id="desc">An illustrated engagement atlas with six identity and recency coordinates and a daily activity trace. Schematic, not live metrics.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7caff5" opacity=".2"/></pattern></defs><rect width="1440" height="650" fill="#1045a3"/><rect width="1440" height="650" fill="url(#dots)"/><path d="M75 96h1290M75 565h1290" stroke="#3c6fc5"/><text x="80" y="68" font-family="sans-serif" font-size="13" letter-spacing="4" fill="#a3d6ff">YOUR AUDIENCE OBSERVATORY / SELF-HOSTED</text><text x="80" y="270" font-family="sans-serif" font-size="90" font-weight="700" letter-spacing="-6" fill="#fff">Lite CDP</text><text x="85" y="338" font-family="sans-serif" font-size="25" fill="#c3e4ff">Know who comes back.</text><text x="85" y="405" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#a3d6ff">IDENTITY × RECENCY × INTENT</text><g transform="translate(700 132)"><rect width="650" height="376" rx="10" fill="#f5faff"/><path d="M120 55h505M120 178h505M120 300h505M120 55v245m168-245v245m168-245v245m169-245v245" stroke="#d4e3f3"/><g font-family="sans-serif" font-size="10" fill="#5d7a9e" text-anchor="middle"><text x="203" y="34">RECENT</text><text x="372" y="34">COOLING</text><text x="540" y="34">DORMANT</text></g><g font-family="sans-serif" font-size="9" fill="#2862a8"><text x="18" y="121">IDENTIFIED</text><text x="18" y="242">ANONYMOUS</text></g><circle cx="203" cy="116" r="48" fill="none" stroke="#dbe8f7"/><path d="M151 116h104M203 64v104" stroke="#c2d7ef" stroke-dasharray="3 4"/><circle cx="203" cy="116" r="39" fill="#378fe0" fill-opacity="0.2" stroke="#378fe0" stroke-opacity=".35"/><circle cx="372" cy="116" r="48" fill="none" stroke="#dbe8f7"/><path d="M320 116h104M372 64v104" stroke="#c2d7ef" stroke