<text x="64" y="330" font-size="46" font-weight="600" letter-spacing="-2">Know the signal.</text>
<text x="64" y="392" font-size="46" font-weight="600" letter-spacing="-2">Understand</text>
<text x="64" y="448" font-size="46" font-weight="600" letter-spacing="-2">the person.</text>
<text x="66" y="510" font-family="monospace" font-size="12" letter-spacing="2" fill="#596d00">EXPLICIT IDENTITY. VISIBLE RULES.</text>
