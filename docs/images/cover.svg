<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Lite CDP — Know the signal. Understand the person.</title>
<desc id="desc">Editable schematic. Two independent anonymous browser event streams join only after both explicitly identify the same site-scoped member ID. No fingerprint matching; not actual customer data.</desc>
